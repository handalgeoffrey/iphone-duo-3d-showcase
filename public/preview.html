<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iPhone Duo — responsive preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #7d7d82;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #frame {
        display: block;
        flex: none;
        border: 0;
        background: #f5f5f7;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe id="frame" title="iPhone Duo responsive preview"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const width = Math.max(320, Math.min(1800, Number(params.get('w')) || 1440));
      const height = Math.max(480, Math.min(1600, Number(params.get('h')) || 900));
      const section = params.get('s');
      const frame = document.getElementById('frame');

      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      frame.width = String(width);
      frame.height = String(height);
      frame.src = '/' + (section ? '#' + section : '');
      window.__frame = frame;

      function fit() {
        const scale = Math.min(
          1,
          (window.innerWidth - 24) / width,
          (window.innerHeight - 24) / height,
        );
        frame.style.transform = 'scale(' + scale + ')';
        window.__preview = { width, height, scale };
      }

      fit();
      window.addEventListener('resize', fit);

      frame.addEventListener('load', function () {
        if (!section) return;
        try {
          const target = frame.contentDocument.getElementById(section);
          if (target) frame.contentWindow.scrollTo(0, target.offsetTop);
        } catch (error) {
          /* same-origin should allow this */
        }
      });
    </script>
  </body>
</html>
